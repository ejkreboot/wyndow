<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Confirm your email</title>
</head>
<body style="margin:0;padding:0;background:#f2f2f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f2f2f0;">
<tr><td align="center" style="padding:48px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background:#ffffff;border:1px solid #e4e4e0;border-radius:20px;">
<tr><td style="padding:36px 36px 8px;font-family:Futura,'Century Gothic','Avenir Next',Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#8a8a85;">KorTech</td></tr>
<tr><td style="padding:0 36px 28px;font-family:Futura,'Century Gothic','Avenir Next',Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;color:#121212;">Confirm your email</td></tr>
<tr><td style="padding:0 36px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td align="center" style="background:#0c0c0c;border-radius:12px;padding:20px 12px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:28px;line-height:32px;letter-spacing:10px;color:#f2f2f0;">{{ .Token }}</td></tr>
</table>
</td></tr>
<tr><td style="padding:24px 36px 0;font-family:Futura,'Century Gothic','Avenir Next',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8a8a85;">Enter this code to confirm <span style="color:#4a4a47;">{{ .Email }}</span>, or <a href="{{ .ConfirmationURL }}" style="color:#121212;text-decoration:underline;">confirm with a link</a>.</td></tr>
<tr><td style="padding:12px 36px 36px;font-family:Futura,'Century Gothic','Avenir Next',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8a8a85;">If you didn’t sign up, ignore this email.</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
<tr><td align="center" style="padding:20px 0 0;font-family:Futura,'Century Gothic','Avenir Next',Helvetica,Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#b8b8b2;">KorTech Family of Apps</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
